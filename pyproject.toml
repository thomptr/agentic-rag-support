[project]
name = "agentic-rag-support"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4",
    "langchain-anthropic>=0.3",
    "langchain-postgres>=0.0.14",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "psycopg[binary]>=3.2",
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.0",
    "streamlit>=1.40",
    "httpx>=0.27",
    # Pin to 2.x to match `lambdas/shared/requirements.txt`. The agent emits
    # parent traces whose IDs the Lambdas use as `parent_observation_id` —
    # both sides need the same wire format. v4.x is OpenTelemetry-based and
    # incompatible with the Lambdas' stateless `Langfuse().span(...)` calls.
    "langfuse>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.4",
    "ragas>=0.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "lambdas"]
markers = [
    "eval: evaluation tests that call real LLMs",
    "integration: integration tests that require running Postgres",
]
